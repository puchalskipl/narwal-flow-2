clean_rooms:
  name: Clean rooms
  description: Start a room clean using Narwal's local clean/start_clean command.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    rooms:
      name: Rooms
      description: Narwal room IDs to clean, in order, or "all" for all current map rooms.
      required: true
      selector:
        object:
    mode:
      name: Mode
      default: vacuum_and_mop
      selector:
        select:
          options:
            - vacuum
            - mop
            - vacuum_then_mop
            - vacuum_and_mop
    suction:
      name: Suction
      default: standard
      selector:
        select:
          options:
            - ai
            - quiet
            - standard
            - strong
            - super_powerful
            - ultra_powerful
    water:
      name: Water
      default: normal
      selector:
        select:
          options:
            - dry
            - normal
            - wet
    mop_strength:
      name: Mop strength
      default: normal
      selector:
        select:
          options:
            - normal
            - high
    passes:
      name: Passes
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
    mop_passes:
      name: Mop passes
      description: Vacuum then mop only. Mop pass count; passes sets the vacuum pass count. Defaults to passes.
      selector:
        number:
          min: 1
          max: 3
          mode: box
    freo:
      name: Freo
      description: Robot sam dobiera ssanie, wodę i cykle (ustawienia trybu są wtedy pomijane przez robota).
      default: false
      selector:
        boolean: {}
    route:
      name: Route
      selector:
        select:
          options:
            - standard
            - meticulous

get_current_task:
  name: Get current task
  description: Debug. Read the robot's current CleanTask (clean/current_clean_task/get) and return it decoded.
  target:
    entity:
      integration: narwal
      domain: vacuum

reset_consumable:
  name: Resetuj przypomnienie o części
  description: Po wymianie albo czyszczeniu kasuje przypomnienie w robocie i odświeża listę.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    rodzaj:
      name: Rodzaj
      required: true
      selector:
        select:
          options:
            - konserwacja
            - wymiana
    pozycja:
      name: Pozycja
      description: Numer pozycji z atrybutu `pozycje` encji konserwacji albo wymiany.
      required: true
      selector:
        number:
          min: 1
          max: 30
          mode: box

send_raw:
  name: Send raw command
  description: Diagnostyka. Wysyła polecenie (krótki temat, np. clean/start_clean) z ładunkiem protobuf w hex i zwraca odpowiedź.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    topic:
      name: Topic
      required: true
      selector:
        text: {}
    payload_hex:
      name: Payload (hex)
      selector:
        text: {}
    timeout:
      name: Timeout
      default: 15
      selector:
        number:
          min: 1
          max: 60
          mode: box
